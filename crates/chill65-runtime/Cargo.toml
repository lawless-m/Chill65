[package]
name = "chill65-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "6502 machine state and interpreter for Atari coin-op hardware"

[dependencies]

# Test-only. The library itself stays dependency-free so it can target
# wasm32 unchanged; the gated integration tests need the assembler as a
# *library* because Space Duel's fifteen-module link still reports errors
# and the CLI exits non-zero on any of them.
[dev-dependencies]
chill65-asm = { path = "../chill65-asm" }

[lib]
name = "chill65_runtime"
path = "src/lib.rs"
